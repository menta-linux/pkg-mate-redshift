name: Build Debian packages

on:
  push:
    branches: [master]
    tags: ['menta/*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: debian:unstable
    steps:
      - name: Install tooling
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl git quilt xz-utils devscripts equivs build-essential fakeroot

      - uses: actions/checkout@v4

      - name: Fetch upstream git commit
        run: |
          # version looks like 0.1.0+git20261022.c2f3fba-1menta1
          FULL=$(dpkg-parsechangelog -S Version)
          UPSTREAM=${FULL%-*}
          HASH=${UPSTREAM##*.}
          mkdir -p ../build
          git clone https://github.com/KeremSoke/mate-redshift.git ../build/upstream
          git -C ../build/upstream checkout "$HASH"
          git -C ../build/upstream archive --prefix="mate-redshift-${UPSTREAM}/" HEAD \
            | xz > "../build/mate-redshift_${UPSTREAM}.orig.tar.xz"
          tar -C ../build -xf "../build/mate-redshift_${UPSTREAM}.orig.tar.xz"
          cp -a debian "../build/mate-redshift-${UPSTREAM}/"
          echo "SRCDIR=$(realpath ../build/mate-redshift-${UPSTREAM})" >> "$GITHUB_ENV"

      - name: Apply quilt patches
        working-directory: ${{ env.SRCDIR }}
        run: |
          export QUILT_PATCHES=debian/patches
          quilt push -a || [ $? -eq 2 ]   # 2 = nothing to apply

      - name: Install build dependencies
        working-directory: ${{ env.SRCDIR }}
        run: |
          mk-build-deps -i -r -t "apt-get -y --no-install-recommends" debian/control

      - name: Build
        working-directory: ${{ env.SRCDIR }}
        run: dpkg-buildpackage -us -uc -b

      - name: Collect artifacts
        run: |
          mkdir -p "$GITHUB_WORKSPACE/artifacts"
          cp -v ../build/*.deb ../build/*.buildinfo ../build/*.changes "$GITHUB_WORKSPACE/artifacts/"

      - uses: actions/upload-artifact@v4
        with:
          name: mate-redshift-debs
          path: artifacts/*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/menta/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: mate-redshift-debs
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
